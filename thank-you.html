<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Height Horizon</title>
<style>
  :root {
    --bg-base: #030303;
    --card-bg: rgba(14, 14, 14, 0.85);
    --gold: #dfbe6f;
    --border-color: rgba(223, 190, 111, 0.25);
  }
  body {
    background-color: var(--bg-base);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    margin: 0;
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8);
  }
  .check {
    width: 60px;
    height: 60px;
    background: rgba(223, 190, 111, 0.1);
    border: 2px solid var(--gold);
    color: var(--gold);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    margin: 0 auto 20px auto;
  }
  h1 { font-size: 1.8rem; margin-bottom: 12px; }
  p { color: #999; font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    background: var(--gold);
    color: #030303;
    font-weight: 700;
    text-decoration: none;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="box">
  <div class="check">✓</div>
  <h1>Details Received Successfully</h1>
  <p>We are verifying your UTR reference ID. Once confirmed, your copy of <span style="color:var(--gold);">Height Horizon</span> will be delivered straight to your email within a few hours.</p>
  <a href="index.html" class="btn">Back to Home</a>
</div>

</body>
</html>
